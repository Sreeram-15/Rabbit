  .title{font:700 24px Arial,sans-serif;fill:#111827}.label{font:13px Arial,sans-serif;fill:#111827}.small{font:11px Arial,sans-serif;fill:#374151}.actor{stroke:#111827;stroke-width:2;fill:none}.box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:12}.usecase{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.external{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:8}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}.arrow{stroke:#374151;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dashed{stroke:#7c3aed;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow-purple)}.lifeline{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:5 5}.msg{stroke:#111827;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#6b7280;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow-gray)}.frame{fill:#fefce8;stroke:#ca8a04;stroke-width:1.2}.activity{fill:#ffffff;stroke:#2563eb;stroke-width:1.8;rx:10}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.startend{fill:#111827;stroke:#111827}.note{fill:#f3f4f6;stroke:#6b7280;stroke-width:1;rx:8}.branch{font:11px Arial,sans-serif;fill:#7c2d12}.section{font:700 14px Arial,sans-serif;fill:#1f2937}
