tems?</text><line x1="490.0" y1="1191" x2="490.0" y2="1201" class="arrow"/><rect x="220" y="1289" width="540" height="48" class="activity"/><text x="490.0" y="1318.0" text-anchor="middle" class="label">Enter contact and shipping details</text><line x1="490.0" y1="1261" x2="490.0" y2="1281" class="arrow"/><rect x="220" y="1359" width="540" height="48" class="activity"/><text x="490.0" y="1388.0" text-anchor="middle" class="label">Create pending checkout session</text><line x1="490.0" y1="1341" x2="490.0" y2="1351" class="arrow"/><rect x="220" y="1429" width="540" height="48" class="activity"/><text x="490.0" y="1458.0" text-anchor="middle" class="label">Approve/capture PayPal payment</text><line x1="490.0" y1="1411" x2="490.0" y2="1421" class="arrow"/><polygon points="490.0,1488 670.0,1523 490.0,1558 310.0,1523" class="decision"/><text x="490.0" y="1518" text-anchor="middle" class="label">Payment status == paid?</text><line x1="490.0" y1="1481" x2="490.0" y2="1491" class="arrow"/><rect x="220" y="1579" width="540" height="48" class="activity"/><text x="490.0" y="1608.0" text-anchor="middle" class="label">Mark checkout paid</text><line x1="490.0" y1="1551" x2="490.0" y2="1571" class="arrow"/><polygon points="490.0,1638 670.0,1673 490.0,1708 310.0,1673" class="decision"/><text x="490.0" y="1668" text-anchor="middle" class="label">Checkout paid and not finalized?</text><line x1="490.0" y1="1631" x2="490.0" y2="1641" class="arrow"/><rect x="220" y="1729" width="540" height="48" class="activity"/><text x="490.0" y="1758.0" text-anchor="middle" class="label">Create final order from checkout</text><line x1="490.0" y1="1701" x2="490.0" y2="1721" class="arrow"/><rect x="220" y="1799" width="540" height="48" class="activity"/><text x="490.0" y="1828.0" text-anchor="middle" class="label">Delete customer cart</text><line x1="490.0" y1="1781" x2="490.0" y2="1791" class="arrow"/><rect x="220" y="1869" width="540" height="48" class="activity"/><text x="490.0" y="1898.0" text-anchor="middle" class="label">Show order confirmation</text><line x1="490.0" y1="1851" x2="490.0" y2="1861" class="arrow"/><rect x="220" y="1939" width="540" height="48" class="activity"/><text x="490.0" y="1968.0" text-anchor="middle" class="label">Customer can view my orders or order details</text><line x1="490.0" y1="1921" x2="490.0" y2="1931" class="arrow"/><circle cx="490.0" cy="2033" r="18" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="490.0" cy="2033" r="11" class="startend"/><line x1="490.0" y1="1991" x2="490.0" y2="2001" class="arrow"/></svg>