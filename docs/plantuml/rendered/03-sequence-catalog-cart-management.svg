<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1319" viewBox="0 0 1020 1319" role="img" aria-label="Rabbit - Catalog Browsing, Product Details, and Cart Management">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
</defs>
<style>
  .title{font:700 24px Arial,sans-serif;fill:#111827}.label{font:13px Arial,sans-serif;fill:#111827}.small{font:11px Arial,sans-serif;fill:#374151}.actor{stroke:#111827;stroke-width:2;fill:none}.box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:12}.usecase{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.external{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:8}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}.arrow{stroke:#374151;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dashed{stroke:#7c3aed;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow-purple)}.lifeline{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:5 5}.msg{stroke:#111827;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#6b7280;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow-gray)}.frame{fill:#fefce8;stroke:#ca8a04;stroke-width:1.2}.activity{fill:#ffffff;stroke:#2563eb;stroke-width:1.8;rx:10}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.startend{fill:#111827;stroke:#111827}.note{fill:#f3f4f6;stroke:#6b7280;stroke-width:1;rx:8}.branch{font:11px Arial,sans-serif;fill:#7c2d12}.section{font:700 14px Arial,sans-serif;fill:#1f2937}
</style><rect width="100%" height="100%" fill="#ffffff"/><text x="510.0" y="36" text-anchor="middle" class="title">Rabbit - Catalog Browsing, Product Details, and Cart Management</text><rect x="15" y="70" width="130" height="45" class="external"/><text x="80.0" y="97.5" text-anchor="middle" class="label">Shopper</text><line x1="80" y1="115" x2="80" y2="1274" class="lifeline"/><rect x="185" y="70" width="130" height="45" class="external"/><text x="250.0" y="97.5" text-anchor="middle" class="label">React</text><line x1="250" y1="115" x2="250" y2="1274" class="lifeline"/><rect x="355" y="70" width="130" height="45" class="external"/><text x="420.0" y="97.5" text-anchor="middle" class="label">API</text><line x1="420" y1="115" x2="420" y2="1274" class="lifeline"/><rect x="525" y="70" width="130" height="45" class="external"/><text x="590.0" y="97.5" text-anchor="middle" class="label">Product</text><line x1="590" y1="115" x2="590" y2="1274" class="lifeline"/><rect x="695" y="70" width="130" height="45" class="external"/><text x="760.0" y="97.5" text-anchor="middle" class="label">Cart</text><line x1="760" y1="115" x2="760" y2="1274" class="lifeline"/><rect x="45" y="128" width="930" height="30" class="frame"/><text x="55" y="148" class="section">Browse catalog</text><line x1="80" y1="188" x2="250" y2="188" class="msg"/><text x="165.0" y="180" text-anchor="middle" class="small">Visit home, collection, search, or</text><text x="165.0" y="195" text-anchor="middle" class="small">sort/filter view</text><line x1="250" y1="226" x2="420" y2="226" class="msg"/><text x="335.0" y="218" text-anchor="middle" class="small">GET /api/products with optional</text><text x="335.0" y="233" text-anchor="middle" class="small">filters</text><line x1="420" y1="264" x2="590" y2="264" class="msg"/><text x="505.0" y="256" text-anchor="middle" class="small">Build Mongo query from filters</text><line x1="420" y1="302" x2="590" y2="302" class="msg"/><text x="505.0" y="294" text-anchor="middle" class="small">find(query).sort(sort).limit(limit)</text><line x1="590" y1="340" x2="420" y2="340" class="msg"/><text x="505.0" y="332" text-anchor="middle" class="small">Product list</text><line x1="420" y1="378" x2="250" y2="378" class="msg"/><text x="335.0" y="370" text-anchor="middle" class="small">Product list JSON</text><rect x="45" y="394" width="930" height="30" class="frame"/><text x="55" y="414" class="section">Product details and similar items</text><line x1="80" y1="454" x2="250" y2="454" class="msg"/><text x="165.0" y="446" text-anchor="middle" class="small">Open product details</text><line x1="250" y1="492" x2="420" y2="492" class="msg"/><text x="335.0" y="484" text-anchor="middle" class="small">GET /api/products/:id</text><line x1="420" y1="530" x2="590" y2="530" class="msg"/><text x="505.0" y="522" text-anchor="middle" class="small">findById(id)</text><rect x="70" y="548" width="880" height="30" class="note"/><text x="510.0" y="568.0" text-anchor="middle" class="label">If product found: return details and fetch /api/products/similar/:id; otherwise 404</text><line x1="420" y1="606" x2="590" y2="606" class="msg"/><text x="505.0" y="598" text-anchor="middle" class="small">find same category/gender</text><text x="505.0" y="613" text-anchor="middle" class="small">excluding current id, sort by</text><text x="505.0" y="628" text-anchor="middle" class="small">rating, limit 4</text><line x1="420" y1="644" x2="250" y2="644" class="msg"/><text x="335.0" y="636" text-anchor="middle" class="small">Similar products</text><rect x="45" y="660" width="930" height="30" class="frame"/><text x="55" y="680" class="section">Add to cart</text><line x1="80" y1="720" x2="250" y2="720" class="msg"/><text x="165.0" y="712" text-anchor="middle" class="small">Add product to cart</text><line x1="250" y1="758" x2="420" y2="758" class="msg"/><text x="335.0" y="750" text-anchor="middle" class="small">POST /api/cart with productId,</text><text x="335.0" y="765" text-anchor="middle" class="small">quantity, size, color, guestId or</text><text x="335.0" y="780" text-anchor="middle" class="small">userId</text><line x1="420" y1="796" x2="590" y2="796" class="msg"/><text x="505.0" y="788" text-anchor="middle" class="small">findById(productId)</text><rect x="70" y="814" width="880" height="30" class="note"/><text x="510.0" y="834.0" text-anchor="middle" class="label">Product missing -&gt; 404; product exists -&gt; find cart by userId or guestId</text><line x1="420" y1="872" x2="760" y2="872" class="msg"/><text x="590.0" y="864" text-anchor="middle" class="small">find by userId or guestId</text><rect x="70" y="890" width="880" height="30" class="note"/><text x="510.0" y="910.0" text-anchor="middle" class="label">Existing same variant -&gt; increment quantity; new variant -&gt; add line; no cart -&gt; create cart</text><line x1="420" y1="948" x2="250" y2="948" class="return"/><text x="335.0" y="940" text-anchor="middle" class="small">200 updated cart or 201 new cart</text><rect x="45" y="964" width="930" height="30" class="frame"/><text x="55" y="984" class="section">Update/remove cart item</text><line x1="80" y1="1024" x2="250" y2="1024" class="msg"/><text x="165.0" y="1016" text-anchor="middle" class="small">Change quantity or remove cart</text><text x="165.0" y="1031" text-anchor="middle" class="small">item</text><line x1="250" y1="1062" x2="420" y2="1062" class="msg"/><text x="335.0" y="1054" text-anchor="middle" class="small">PUT /api/cart or DELETE /api/cart</text><line x1="420" y1="1100" x2="760" y2="1100" class="msg"/><text x="590.0" y="1092" text-anchor="middle" class="small">find matching product/size/color</text><text x="590.0" y="1107" text-anchor="middle" class="small">line</text><rect x="70" y="1118" width="880" height="30" class="note"/><text x="510.0" y="1138.0" text-anchor="middle" class="label">Quantity &gt; 0 sets quantity; quantity &lt;= 0 or remove deletes line; totalPrice is recalculated</text><line x1="420" y1="1176" x2="250" y2="1176" class="msg"/><text x="335.0" y="1168" text-anchor="middle" class="small">Updated cart or 404</text></svg>