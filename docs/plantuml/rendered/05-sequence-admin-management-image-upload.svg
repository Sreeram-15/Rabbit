<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
</defs>
<style>
  .title{font:700 24px Arial,sans-serif;fill:#111827}.label{font:13px Arial,sans-serif;fill:#111827}.small{font:11px Arial,sans-serif;fill:#374151}.actor{stroke:#111827;stroke-width:2;fill:none}.box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:12}.usecase{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.external{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:8}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}.arrow{stroke:#374151;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dashed{stroke:#7c3aed;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow-purple)}.lifeline{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:5 5}.msg{stroke:#111827;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#6b7280;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow-gray)}.frame{fill:#fefce8;stroke:#ca8a04;stroke-width:1.2}.activity{fill:#ffffff;stroke:#2563eb;stroke-width:1.8;rx:10}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.startend{fill:#111827;stroke:#111827}.note{fill:#f3f4f6;stroke:#6b7280;stroke-width:1;rx:8}.branch{font:11px Arial,sans-serif;fill:#7c2d12}.section{font:700 14px Arial,sans-serif;fill:#1f2937}
</style><rect width="100%" height="100%" fill="#ffffff"/><text x="850.0" y="36" text-anchor="middle" class="title">Rabbit - Admin Management and Image Upload</text><rect x="15" y="70" width="130" height="45" class="external"/><text x="80.0" y="97.5" text-anchor="middle" class="label">Admin</text><line x1="80" y1="115" x2="80" y2="1350" class="lifeline"/><rect x="185" y="70" width="130" height="45" class="external"/><text x="250.0" y="97.5" text-anchor="middle" class="label">React</text><line x1="250" y1="115" x2="250" y2="1350" class="lifeline"/><rect x="355" y="70" width="130" height="45" class="external"/><text x="420.0" y="97.5" text-anchor="middle" class="label">API</text><line x1="420" y1="115" x2="420" y2="1350" class="lifeline"/><rect x="525" y="70" width="130" height="45" class="external"/><text x="590.0" y="97.5" text-anchor="middle" class="label">Auth</text><line x1="590" y1="115" x2="590" y2="1350" class="lifeline"/><rect x="695" y="70" width="130" height="45" class="external"/><text x="760.0" y="97.5" text-anchor="middle" class="label">User</text><line x1="760" y1="115" x2="760" y2="1350" class="lifeline"/><rect x="865" y="70" width="130" height="45" class="external"/><text x="930.0" y="97.5" text-anchor="middle" class="label">Product</text><line x1="930" y1="115" x2="930" y2="1350" class="lifeline"/><rect x="1035" y="70" width="130" height="45" class="external"/><text x="1100.0" y="97.5" text-anchor="middle" class="label">Order</text><line x1="1100" y1="115" x2="1100" y2="1350" class="lifeline"/><rect x="1205" y="70" width="130" height="45" class="external"/><text x="1270.0" y="97.5" text-anchor="middle" class="label">Upload</text><line x1="1270" y1="115" x2="1270" y2="1350" class="lifeline"/><rect x="1375" y="70" width="130" height="45" class="external"/><text x="1440.0" y="97.5" text-anchor="middle" class="label">Cloudinary</text><line x1="1440" y1="115" x2="1440" y2="1350" class="lifeline"/><rect x="45" y="128" width="1610" height="30" class="frame"/><text x="55" y="148" class="section">Admin route guard</text><line x1="80" y1="188" x2="250" y2="188" class="msg"/><text x="165.0" y="180" text-anchor="middle" class="small">Open /admin route</text><line x1="250" y1="226" x2="250" y2="226" class="return"/><text x="250.0" y="218" text-anchor="middle" class="small">ProtectedRoute requires user.role</text><text x="250.0" y="233" text-anchor="middle" class="small">== admin</text><rect x="70" y="244" width="1560" height="30" class="note"/><text x="850.0" y="264.0" text-anchor="middle" class="label">Not logged in or wrong role -&gt; redirect to /login; admin role -&gt; render AdminLayout</text><rect x="45" y="280" width="1610" height="30" class="frame"/><text x="55" y="300" class="section">Manage users</text><line x1="80" y1="340" x2="250" y2="340" class="msg"/><text x="165.0" y="332" text-anchor="middle" class="small">List/create/update/delete users</text><line x1="250" y1="378" x2="420" y2="378" class="msg"/><text x="335.0" y="370" text-anchor="middle" class="small">GET/POST/PUT/DELETE</text><text x="335.0" y="385" text-anchor="middle" class="small">/api/admin/users with Bearer token</text><line x1="420" y1="416" x2="590" y2="416" class="msg"/><text x="505.0" y="408" text-anchor="middle" class="small">protect then admin</text><line x1="420" y1="454" x2="760" y2="454" class="msg"/><text x="590.0" y="446" text-anchor="middle" class="small">query, create, update, or delete</text><text x="590.0" y="461" text-anchor="middle" class="small">user</text><line x1="420" y1="492" x2="250" y2="492" class="return"/><text x="335.0" y="484" text-anchor="middle" class="small">User result or error</text><rect x="45" y="508" width="1610" height="30" class="frame"/><text x="55" y="528" class="section">Manage products</text><line x1="80" y1="568" x2="250" y2="568" class="msg"/><text x="165.0" y="560" text-anchor="middle" class="small">List/create/update/delete products</text><line x1="250" y1="606" x2="420" y2="606" class="msg"/><text x="335.0" y="598" text-anchor="middle" class="small">GET /api/admin/products or</text><text x="335.0" y="613" text-anchor="middle" class="small">POST/PUT/DELETE /api/products</text><line x1="420" y1="644" x2="590" y2="644" class="msg"/><text x="505.0" y="636" text-anchor="middle" class="small">protect then admin</text><line x1="420" y1="682" x2="930" y2="682" class="msg"/><text x="675.0" y="674" text-anchor="middle" class="small">find all, save, update fields, or</text><text x="675.0" y="689" text-anchor="middle" class="small">delete product</text><line x1="420" y1="720" x2="250" y2="720" class="return"/><text x="335.0" y="712" text-anchor="middle" class="small">Product result or error</text><rect x="45" y="736" width="1610" height="30" class="frame"/><text x="55" y="756" class="section">Upload image</text><line x1="80" y1="796" x2="250" y2="796" class="msg"/><text x="165.0" y="788" text-anchor="middle" class="small">Select image file</text><line x1="250" y1="834" x2="420" y2="834" class="msg"/><text x="335.0" y="826" text-anchor="middle" class="small">POST /api/upload multipart image</text><line x1="420" y1="872" x2="1270" y2="872" class="msg"/><text x="845.0" y="864" text-anchor="middle" class="small">store file in memory</text><rect x="70" y="890" width="1560" height="30" class="note"/><text x="850.0" y="910.0" text-anchor="middle" class="label">No file uploaded -&gt; 404; file present -&gt; stream to Cloudinary</text><line x1="420" y1="948" x2="1440" y2="948" class="msg"/><text x="930.0" y="940" text-anchor="middle" class="small">upload_stream(file buffer)</text><line x1="1440" y1="986" x2="420" y2="986" class="msg"/><text x="930.0" y="978" text-anchor="middle" class="small">secure_url</text><line x1="420" y1="1024" x2="250" y2="1024" class="return"/><text x="335.0" y="1016" text-anchor="middle" class="small">image_url</text><rect x="45" y="1040" width="1610" height="30" class="frame"/><text x="55" y="1060" class="section">Manage orders</text><line x1="80" y1="1100" x2="250" y2="1100" class="msg"/><text x="165.0" y="1092" text-anchor="middle" class="small">List/update/delete orders</text><line x1="250" y1="1138" x2="420" y2="1138" class="msg"/><text x="335.0" y="1130" text-anchor="middle" class="small">GET/PUT/DELETE /api/admin/orders</text><text x="335.0" y="1145" text-anchor="middle" class="small">with Bearer token</text><line x1="420" y1="1176" x2="590" y2="1176" class="msg"/><text x="505.0" y="1168" text-anchor="middle" class="small">protect then admin</text><line x1="420" y1="1214" x2="1100" y2="1214" class="msg"/><text x="760.0" y="1206" text-anchor="middle" class="small">find all, set status/deliveredAt,</text><text x="760.0" y="1221" text-anchor="middle" class="small">or delete</text><line x1="420" y1="1252" x2="250" y2="1252" class="return"/><text x="335.0" y="1244" text-anchor="middle" class="small">Order result or error</text></svg>