<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1471" viewBox="0 0 1360 1471" role="img" aria-label="Rabbit - Registration, Login, Protected Access, and Guest Cart Merge">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
</defs>
<style>
  .title{font:700 24px Arial,sans-serif;fill:#111827}.label{font:13px Arial,sans-serif;fill:#111827}.small{font:11px Arial,sans-serif;fill:#374151}.actor{stroke:#111827;stroke-width:2;fill:none}.box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:12}.usecase{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.external{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:8}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}.arrow{stroke:#374151;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dashed{stroke:#7c3aed;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow-purple)}.lifeline{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:5 5}.msg{stroke:#111827;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#6b7280;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow-gray)}.frame{fill:#fefce8;stroke:#ca8a04;stroke-width:1.2}.activity{fill:#ffffff;stroke:#2563eb;stroke-width:1.8;rx:10}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.startend{fill:#111827;stroke:#111827}.note{fill:#f3f4f6;stroke:#6b7280;stroke-width:1;rx:8}.branch{font:11px Arial,sans-serif;fill:#7c2d12}.section{font:700 14px Arial,sans-serif;fill:#1f2937}
</style><rect width="100%" height="100%" fill="#ffffff"/><text x="680.0" y="36" text-anchor="middle" class="title">Rabbit - Registration, Login, Protected Access, and Guest Cart Merge</text><rect x="15" y="70" width="130" height="45" class="external"/><text x="80.0" y="97.5" text-anchor="middle" class="label">Shopper</text><line x1="80" y1="115" x2="80" y2="1426" class="lifeline"/><rect x="185" y="70" width="130" height="45" class="external"/><text x="250.0" y="97.5" text-anchor="middle" class="label">React</text><line x1="250" y1="115" x2="250" y2="1426" class="lifeline"/><rect x="355" y="70" width="130" height="45" class="external"/><text x="420.0" y="97.5" text-anchor="middle" class="label">API</text><line x1="420" y1="115" x2="420" y2="1426" class="lifeline"/><rect x="525" y="70" width="130" height="45" class="external"/><text x="590.0" y="97.5" text-anchor="middle" class="label">Auth</text><line x1="590" y1="115" x2="590" y2="1426" class="lifeline"/><rect x="695" y="70" width="130" height="45" class="external"/><text x="760.0" y="97.5" text-anchor="middle" class="label">User</text><line x1="760" y1="115" x2="760" y2="1426" class="lifeline"/><rect x="865" y="70" width="130" height="45" class="external"/><text x="930.0" y="97.5" text-anchor="middle" class="label">Cart</text><line x1="930" y1="115" x2="930" y2="1426" class="lifeline"/><rect x="1035" y="70" width="130" height="45" class="external"/><text x="1100.0" y="97.5" text-anchor="middle" class="label">JWT</text><line x1="1100" y1="115" x2="1100" y2="1426" class="lifeline"/><rect x="45" y="128" width="1270" height="30" class="frame"/><text x="55" y="148" class="section">New account</text><line x1="80" y1="188" x2="250" y2="188" class="msg"/><text x="165.0" y="180" text-anchor="middle" class="small">Submit registration form</text><line x1="250" y1="226" x2="420" y2="226" class="msg"/><text x="335.0" y="218" text-anchor="middle" class="small">POST /api/users/register</text><line x1="420" y1="264" x2="760" y2="264" class="msg"/><text x="590.0" y="256" text-anchor="middle" class="small">findOne(email)</text><rect x="70" y="282" width="1220" height="30" class="note"/><text x="680.0" y="302.0" text-anchor="middle" class="label">Alt: duplicate email -&gt; 400 User already exists; otherwise save hashed customer user</text><line x1="420" y1="340" x2="1100" y2="340" class="msg"/><text x="760.0" y="332" text-anchor="middle" class="small">sign({ user: { id, role } },</text><text x="760.0" y="347" text-anchor="middle" class="small">JWT_SECRET)</text><line x1="1100" y1="378" x2="420" y2="378" class="msg"/><text x="760.0" y="370" text-anchor="middle" class="small">token</text><line x1="420" y1="416" x2="250" y2="416" class="return"/><text x="335.0" y="408" text-anchor="middle" class="small">201 user + token</text><rect x="45" y="432" width="1270" height="30" class="frame"/><text x="55" y="452" class="section">Login</text><line x1="80" y1="492" x2="250" y2="492" class="msg"/><text x="165.0" y="484" text-anchor="middle" class="small">Submit login form</text><line x1="250" y1="530" x2="420" y2="530" class="msg"/><text x="335.0" y="522" text-anchor="middle" class="small">POST /api/users/login</text><line x1="420" y1="568" x2="760" y2="568" class="msg"/><text x="590.0" y="560" text-anchor="middle" class="small">findOne(email) +</text><text x="590.0" y="575" text-anchor="middle" class="small">matchPassword(password)</text><rect x="70" y="586" width="1220" height="30" class="note"/><text x="680.0" y="606.0" text-anchor="middle" class="label">Alt: missing user or password mismatch -&gt; 400 Invalid credentials</text><line x1="420" y1="644" x2="1100" y2="644" class="msg"/><text x="760.0" y="636" text-anchor="middle" class="small">sign({ user: { id, role } },</text><text x="760.0" y="651" text-anchor="middle" class="small">JWT_SECRET)</text><line x1="1100" y1="682" x2="420" y2="682" class="msg"/><text x="760.0" y="674" text-anchor="middle" class="small">token</text><line x1="420" y1="720" x2="250" y2="720" class="msg"/><text x="335.0" y="712" text-anchor="middle" class="small">user + token</text><rect x="45" y="736" width="1270" height="30" class="frame"/><text x="55" y="756" class="section">Guest cart merge on login</text><line x1="250" y1="796" x2="420" y2="796" class="msg"/><text x="335.0" y="788" text-anchor="middle" class="small">POST /api/cart/merge with Bearer</text><text x="335.0" y="803" text-anchor="middle" class="small">token + guestId</text><line x1="420" y1="834" x2="590" y2="834" class="msg"/><text x="505.0" y="826" text-anchor="middle" class="small">protect</text><line x1="590" y1="872" x2="1100" y2="872" class="msg"/><text x="845.0" y="864" text-anchor="middle" class="small">verify token</text><line x1="590" y1="910" x2="760" y2="910" class="msg"/><text x="675.0" y="902" text-anchor="middle" class="small">findById(decoded.user.id).select(-password)</text><line x1="760" y1="948" x2="590" y2="948" class="msg"/><text x="675.0" y="940" text-anchor="middle" class="small">req.user</text><line x1="590" y1="986" x2="420" y2="986" class="msg"/><text x="505.0" y="978" text-anchor="middle" class="small">next()</text><line x1="420" y1="1024" x2="930" y2="1024" class="msg"/><text x="675.0" y="1016" text-anchor="middle" class="small">find guestCart and userCart</text><rect x="70" y="1042" width="1220" height="30" class="note"/><text x="680.0" y="1055.0" text-anchor="middle" class="label">If both carts exist: merge matching size/color/product lines, recalculate total, save userCart,</text><text x="680.0" y="1070.0" text-anchor="middle" class="label">delete guestCart</text><rect x="70" y="1080" width="1220" height="30" class="note"/><text x="680.0" y="1100.0" text-anchor="middle" class="label">If guest cart only: assign guest cart to req.user and clear guestId</text><rect x="70" y="1118" width="1220" height="30" class="note"/><text x="680.0" y="1138.0" text-anchor="middle" class="label">If no guest cart but user cart exists: return userCart; otherwise 404 No Cart Found</text><rect x="45" y="1154" width="1270" height="30" class="frame"/><text x="55" y="1174" class="section">Protected access</text><line x1="80" y1="1214" x2="250" y2="1214" class="msg"/><text x="165.0" y="1206" text-anchor="middle" class="small">Open protected profile/admin route</text><line x1="250" y1="1252" x2="420" y2="1252" class="msg"/><text x="335.0" y="1244" text-anchor="middle" class="small">GET protected endpoint with Bearer</text><text x="335.0" y="1259" text-anchor="middle" class="small">token</text><line x1="420" y1="1290" x2="590" y2="1290" class="msg"/><text x="505.0" y="1282" text-anchor="middle" class="small">protect and optional admin check</text><rect x="70" y="1308" width="1220" height="30" class="note"/><text x="680.0" y="1328.0" text-anchor="middle" class="label">Missing/invalid token -&gt; 401; non-admin admin route -&gt; 403; authorized -&gt; protected data</text></svg>