<marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
</defs>
<style>
  .title{font:700 24px Arial,sans-serif;fill:#111827}.label{font:13px Arial,sans-serif;fill:#111827}.small{font:11px Arial,sans-serif;fill:#374151}.actor{stroke:#111827;stroke-width:2;fill:none}.box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:12}.usecase{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.external{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:8}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}.arrow{stroke:#374151;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dashed{stroke:#7c3aed;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow-purple)}.lifeline{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:5 5}.msg{stroke:#111827;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#6b7280;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow-gray)}.frame{fill:#fefce8;stroke:#ca8a04;stroke-width:1.2}.activity{fill:#ffffff;stroke:#2563eb;stroke-width:1.8;rx:10}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.startend{fill:#111827;stroke:#111827}.note{fill:#f3f4f6;stroke:#6b7280;stroke-width:1;rx:8}.branch{font:11px Arial,sans-serif;fill:#7c2d12}.section{font:700 14px Arial,sans-serif;fill:#1f2937}
</style><rect width="100%" height="100%" fill="#ffffff"/><text x="850.0" y="36" text-anchor="middle" class="title">Rabbit - Checkout, PayPal Payment, Order Finalization, and Customer Order Views</text><rect x="15" y="70" width="130" height="45" class="external"/><text x="80.0" y="97.5" text-anchor="middle" class="label">Customer</text><line x1="80" y1="115" x2="80" y2="1654" class="lifeline"/><rect x="185" y="70" width="130" height="45" class="external"/><text x="250.0" y="97.5" text-anchor="middle" class="label">React</text><line x1="250" y1="115" x2="250" y2="1654" class="lifeline"/><rect x="355" y="70" width="130" height="45" class="external"/><text x="420.0" y="97.5" text-anchor="middle" class="label">Redux</text><line x1="420" y1="115" x2="420" y2="1654" class="lifeline"/><rect x="525" y="70" width="130" height="45" class="external"/><text x="590.0" y="97.5" text-anchor="middle" class="label">API</text><line x1="590" y1="115" x2="590" y2="1654" class="lifeline"/><rect x="695" y="70" width="130" height="45" class="external"/><text x="760.0" y="97.5" text-anchor="middle" class="label">Auth</text><line x1="760" y1="115" x2="760" y2="1654" class="lifeline"/><rect x="865" y="70" width="130" height="45" class="external"/><text x="930.0" y="97.5" text-anchor="middle" class="label">Checkout</text><line x1="930" y1="115" x2="930" y2="1654" class="lifeline"/><rect x="1035" y="70" width="130" height="45" class="external"/><text x="1100.0" y="97.5" text-anchor="middle" class="label">PayPal</text><line x1="1100" y1="115" x2="1100" y2="1654" class="lifeline"/><rect x="1205" y="70" width="130" height="45" class="external"/><text x="1270.0" y="97.5" text-anchor="middle" class="label">Order</text><line x1="1270" y1="115" x2="1270" y2="1654" class="lifeline"/><rect x="1375" y="70" width="130" height="45" class="external"/><text x="1440.0" y="97.5" text-anchor="middle" class="label">Cart</text><line x1="1440" y1="115" x2="1440" y2="1654" class="lifeline"/><rect x="45" y="128" width="1610" height="30" class="frame"/><text x="55" y="148" class="section">Checkout session</text><line x1="80" y1="188" x2="250" y2="188" class="msg"/><text x="165.0" y="180" text-anchor="middle" class="small">Open checkout page</text><rect x="70" y="206" width="1560" height="30" class="note"/><text x="850.0" y="226.0" text-anchor="middle" class="label">If cart missing or empty: redirect home / show empty cart</text><line x1="80" y1="264" x2="250" y2="264" class="msg"/><text x="165.0" y="256" text-anchor="middle" class="small">Submit shipping address</text><line x1="250" y1="302" x2="420" y2="302" class="msg"/><text x="335.0" y="294" text-anchor="middle" class="small">createCheckout(checkoutItems,</text><text x="335.0" y="309" text-anchor="middle" class="small">shippingAddress, PayPal,</text><text x="335.0" y="324" text-anchor="middle" class="small">totalPrice)</text><line x1="420" y1="340" x2="590" y2="340" class="msg"/><text x="505.0" y="332" text-anchor="middle" class="small">POST /api/checkout with Bearer</text><text x="505.0" y="347" text-anchor="middle" class="small">token</text><line x1="590" y1="378" x2="760" y2="378" class="msg"/><text x="675.0" y="370" text-anchor="middle" class="small">protect</text><line x1="760" y1="416" x2="590" y2="416" class="msg"/><text x="675.0" y="408" text-anchor="middle" class="small">req.user</text><rect x="70" y="434" width="1560" height="30" class="note"/><text x="850.0" y="454.0" text-anchor="middle" class="label">No checkout items -&gt; 400; valid data -&gt; create pending checkout session</text><line x1="590" y1="492" x2="930" y2="492" class="msg"/><text x="760.0" y="484" text-anchor="middle" class="small">create pending checkout session</text><line x1="930" y1="530" x2="590" y2="530" class="msg"/><text x="760.0" y="522" text-anchor="middle" class="small">Checkout document with _id</text><line x1="590" y1="568" x2="420" y2="568" class="return"/><text x="505.0" y="560" text-anchor="middle" class="small">201 checkout</text><line x1="420" y1="606" x2="250" y2="606" class="msg"/><text x="335.0" y="598" text-anchor="middle" class="small">checkoutId</text><rect x="45" y="622" width="1610" height="30" class="frame"/><text x="55" y="642" class="section">PayPal payment</text><line x1="250" y1="682" x2="1100" y2="682" class="msg"/><text x="675.0" y="674" text-anchor="middle" class="small">Render PayPalButtons with USD</text><text x="675.0" y="689" text-anchor="middle" class="small">amount</text><line x1="80" y1="720" x2="1100" y2="720" class="msg"/><text x="590.0" y="712" text-anchor="middle" class="small">Approve payment</text><line x1="1100" y1="758" x2="250" y2="758" class="msg"/><text x="675.0" y="750" text-anchor="middle" class="small">Captured payment details</text><line x1="250" y1="796" x2="590" y2="796" class="msg"/><text x="420.0" y="788" text-anchor="middle" class="small">PUT /api/checkout/:id/pay</text><text x="420.0" y="803" text-anchor="middle" class="small">paymentStatus=paid</text><line x1="590" y1="834" x2="760" y2="834" class="msg"/><text x="675.0" y="826" text-anchor="middle" class="small">protect</text><line x1="590" y1="872" x2="930" y2="872" class="msg"/><text x="760.0" y="864" text-anchor="middle" class="small">findById(id)</text><rect x="70" y="890" width="1560" height="30" class="note"/><text x="850.0" y="910.0" text-anchor="middle" class="label">Checkout missing -&gt; 404; invalid payment status -&gt; 400</text><line x1="590" y1="948" x2="930" y2="948" class="msg"/><text x="760.0" y="940" text-anchor="middle" class="small">set isPaid, paymentStatus,</text><text x="760.0" y="955" text-anchor="middle" class="small">paymentDetails, paidAt</text><line x1="590" y1="986" x2="250" y2="986" class="return"/><text x="420.0" y="978" text-anchor="middle" class="small">200 paid checkout</text><rect x="45" y="1002" width="1610" height="30" class="frame"/><text x="55" y="1022" class="section">Finalize order</text><line x1="250" y1="1062" x2="590" y2="1062" class="msg"/><text x="420.0" y="1054" text-anchor="middle" class="small">POST /api/checkout/:id/finalize</text><line x1="590" y1="1100" x2="930" y2="1100" class="msg"/><text x="760.0" y="1092" text-anchor="middle" class="small">findById(id)</text><rect x="70" y="1118" width="1560" height="30" class="note"/><text x="850.0" y="1138.0" text-anchor="middle" class="label">If paid and not finalized: create order, mark checkout finalized, delete user cart</text><line x1="590" y1="1176" x2="1270" y2="1176" class="msg"/><text x="930.0" y="1168" text-anchor="middle" class="small">create order from checkout</text><text x="930.0" y="1183" text-anchor="middle" class="small">items/address/payment</text><line x1="590" y1="1214" x2="930" y2="1214" class="msg"/><text x="760.0" y="1206" text-anchor="middle" class="small">set isFinalized and finalizedAt</text><line x1="590" y1="1252" x2="1440" y2="1252" class="msg"/><text x="1015.0" y="1244" text-anchor="middle" class="small">delete user cart</text><line x1="590" y1="1290" x2="250" y2="1290" class="return"/><text x="420.0" y="1282" text-anchor="middle" class="small">201 final order</text><line x1="250" y1="1328" x2="80" y2="1328" class="msg"/><text x="165.0" y="1320" text-anchor="middle" class="small">Navigate to order confirmation</text><rect x="45" y="1344" width="1610" height="30" class="frame"/><text x="55" y="1364" class="section">Customer order views</text><line x1="80" y1="1404" x2="250" y2="1404" class="msg"/><text x="165.0" y="1396" text-anchor="middle" class="small">View order list or order details</text><line x1="250" y1="1442" x2="590" y2="1442" class="msg"/><text x="420.0" y="1434" text-anchor="middle" class="small">GET /api/orders/my-orders or</text><text x="420.0" y="1449" text-anchor="middle" class="small">/api/orders/:id with Bearer token</text><line x1="590" y1="1480" x2="1270" y2="1480" class="msg"/><text x="930.0" y="1472" text-anchor="middle" class="small">find by authenticated user or</text><text x="930.0" y="1487" text-anchor="middle" class="small">order id</text><line x1="1270" y1="1518" x2="590" y2="1518" class="msg"/><text x="930.0" y="1510" text-anchor="middle" class="small">Order data</text><line x1="590" y1="1556" x2="250" y2="1556" class="return"/><text x="420.0" y="1548" text-anchor="middle" class="small">Orders/details JSON</text></svg>