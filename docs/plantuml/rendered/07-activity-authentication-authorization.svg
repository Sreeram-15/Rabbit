</defs>
<style>
  .title{font:700 24px Arial,sans-serif;fill:#111827}.label{font:13px Arial,sans-serif;fill:#111827}.small{font:11px Arial,sans-serif;fill:#374151}.actor{stroke:#111827;stroke-width:2;fill:none}.box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:12}.usecase{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.external{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:8}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}.arrow{stroke:#374151;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dashed{stroke:#7c3aed;stroke-width:1.4;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow-purple)}.lifeline{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:5 5}.msg{stroke:#111827;stroke-width:1.5;marker-end:url(#arrow)}.return{stroke:#6b7280;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow-gray)}.frame{fill:#fefce8;stroke:#ca8a04;stroke-width:1.2}.activity{fill:#ffffff;stroke:#2563eb;stroke-width:1.8;rx:10}.decision{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8}.startend{fill:#111827;stroke:#111827}.note{fill:#f3f4f6;stroke:#6b7280;stroke-width:1;rx:8}.branch{font:11px Arial,sans-serif;fill:#7c2d12}.section{font:700 14px Arial,sans-serif;fill:#1f2937}
</style><rect width="100%" height="100%" fill="#ffffff"/><text x="490.0" y="36" text-anchor="middle" class="title">Rabbit - Authentication and Authorization Activity</text><circle cx="490.0" cy="80" r="16" class="startend"/><polygon points="490.0,103 670.0,138 490.0,173 310.0,138" class="decision"/><text x="490.0" y="133" text-anchor="middle" class="label">Endpoint requires authentication?</text><line x1="490.0" y1="108" x2="490.0" y2="106" class="arrow"/><rect x="170" y="198" width="640" height="44" class="note"/><text x="490.0" y="225.0" text-anchor="middle" class="label">No: run public route handler and return route response</text><line x1="490.0" y1="166" x2="490.0" y2="186" class="arrow"/><polygon points="490.0,248 670.0,283 490.0,318 310.0,283" class="decision"/><text x="490.0" y="278" text-anchor="middle" class="label">Authorization header starts with</text><text x="490.0" y="293" text-anchor="middle" class="label">Bearer?</text><line x1="490.0" y1="246" x2="490.0" y2="251" class="arrow"/><rect x="170" y="343" width="640" height="44" class="note"/><text x="490.0" y="370.0" text-anchor="middle" class="label">No: return 401 no token provided</text><line x1="490.0" y1="311" x2="490.0" y2="331" class="arrow"/><rect x="220" y="404" width="540" height="48" class="activity"/><text x="490.0" y="433.0" text-anchor="middle" class="label">Verify JWT with JWT_SECRET</text><line x1="490.0" y1="391" x2="490.0" y2="396" class="arrow"/><polygon points="490.0,463 670.0,498 490.0,533 310.0,498" class="decision"/><text x="490.0" y="493" text-anchor="middle" class="label">Token valid?</text><line x1="490.0" y1="456" x2="490.0" y2="466" class="arrow"/><rect x="170" y="558" width="640" height="44" class="note"/><text x="490.0" y="585.0" text-anchor="middle" class="label">No: return 401 token failed</text><line x1="490.0" y1="526" x2="490.0" y2="546" class="arrow"/><rect x="220" y="619" width="540" height="48" class="activity"/><text x="490.0" y="648.0" text-anchor="middle" class="label">Load user by decoded user id without password</text><line x1="490.0" y1="606" x2="490.0" y2="611" class="arrow"/><polygon points="490.0,678 670.0,713 490.0,748 310.0,713" class="decision"/><text x="490.0" y="708" text-anchor="middle" class="label">Route requires admin?</text><line x1="490.0" y1="671" x2="490.0" y2="681" class="arrow"/><rect x="170" y="773" width="640" height="44" class="note"/><text x="490.0" y="800.0" text-anchor="middle" class="label">No: run private route handler and return protected response</text><line x1="490.0" y1="741" x2="490.0" y2="761" class="arrow"/><polygon points="490.0,823 670.0,858 490.0,893 310.0,858" class="decision"/><text x="490.0" y="853" text-anchor="middle" class="label">req.user.role == admin?</text><line x1="490.0" y1="821" x2="490.0" y2="826" class="arrow"/><rect x="170" y="918" width="640" height="44" class="note"/><text x="490.0" y="945.0" text-anchor="middle" class="label">No: return 403 not authorized as admin</text><line x1="490.0" y1="886" x2="490.0" y2="906" class="arrow"/><rect x="220" y="979" width="540" height="48" class="activity"/><text x="490.0" y="1008.0" text-anchor="middle" class="label">Run admin route handler</text><line x1="490.0" y1="966" x2="490.0" y2="971" class="arrow"/><rect x="220" y="1049" width="540" height="48" class="activity"/><text x="490.0" y="1078.0" text-anchor="middle" class="label">Return protected response</text><line x1="490.0" y1="1031" x2="490.0" y2="1041" class="arrow"/><circle cx="490.0" cy="1143" r="18" fill="#fff" stroke="#111827" stroke-width="2"/><circle cx="490.0" cy="1143" r="11" class="startend"/><line x1="490.0" y1="1101" x2="490.0" y2="1111" class="arrow"/></svg>